[package]
name = "swarmlet-node-shell"
version = "0.1.0"
description = "Desktop shell for the Swarmlet node agent: window, tray, autostart, sidecar"
edition = "2021"
rust-version = "1.77.2"
license = "SEE LICENSE IN ../../../LICENSE"

[lib]
name = "swarmlet_node_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
